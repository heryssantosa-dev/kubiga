<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>RSI - Report Sistem Integrasi</title>

  <!-- FAVICON/LOGO TAB BROWSER -->
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=3">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png?v=3">

  <!-- Siapkan koneksi ke Google lebih awal (loading lebih cepat) -->
  <link rel="preconnect" href="https://script.google.com">

  <!-- PWA: supaya bisa di-install di HP -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#047857">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="RSI">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=3">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* Latar = warna menu bawah aplikasi (terang #fff / gelap #0f172a). Kalau di iPhone PWA masih tersisa celah di bawah iframe,
       celah itu menyatu dengan menu bawah (bukan pita hijau). Bagian atas selalu tertutup header aplikasi yang hijau. */
    html, body { width: 100%; height: 100%; overflow: hidden; background-color: #ffffff; overscroll-behavior: none; }
    @media (prefers-color-scheme: dark) { html, body { background-color: #0f172a; } }
    /* #shell = penuh layar (kiri/kanan/atas/bawah = 0). iframe mengisi 100% #shell, jadi tingginya mengikuti #shell
       (bukan satuan vh/dvh yang di iPhone PWA bisa lebih pendek dari layar -> muncul pita di bawah).
       Atas TIDAK digeser: header aplikasi sudah menambah jarak status bar sendiri (env safe-area-inset-top) di dalam iframe;
       menggeser lagi dari sini membuat jaraknya terhitung 2x (header hijau terlalu tinggi). */
    #shell { position: fixed; left: 0; right: 0; top: 0; bottom: 0; }
    /* iPhone PWA (layar utama): tinggi 100% / innerHeight sering lebih pendek ~100px dari layar fisik -> celah putih di bawah menu & modal terpotong.
       Di mode standalone pakai satuan tinggi layar penuh (lvh / vh), bukan 100%. Browser biasa & Android tidak terpengaruh (khusus iOS + standalone; Android tidak disentuh agar keyboard tetap menyusutkan layar). */
    @supports (-webkit-touch-callout: none) { @media (display-mode: standalone) {
      html, body { height: 100vh; height: 100lvh; }
      #shell { bottom: auto; height: 100vh; height: 100lvh; }
    } }
    #shell iframe { display: block; width: 100%; height: 100%; border: none; background: #ffffff; }
    @media (prefers-color-scheme: dark) { #shell iframe { background: #0f172a; } }
    #dbg { display: none; position: fixed; z-index: 99; left: 6px; top: 70px; max-width: 92vw; padding: 6px 8px; border-radius: 8px;
           background: rgba(0,0,0,.82); color: #a7f3d0; font: 11px/1.45 ui-monospace, monospace; white-space: pre-wrap; }

    /* LAYAR LOADING: gaya halaman login (tanpa form). Isi mengikuti halaman yang dibuka (lihat skrip LOADER di bawah). */
    #loader {
      position: fixed; inset: 0; z-index: 10; overflow: hidden;
      display: flex; flex-direction: column; justify-content: center;
      padding: 0 clamp(32px, 7vw, 140px) 0 clamp(40px, 5vw, 96px);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f3faf6;
      background-image:
        radial-gradient(900px 620px at 16% 18%, rgba(16,185,129,.17), transparent 62%),
        radial-gradient(760px 540px at 86% 88%, rgba(4,120,87,.15), transparent 62%),
        radial-gradient(rgba(4,120,87,.13) 1px, transparent 1.3px),
        linear-gradient(135deg, #f8fcfa 0%, #e9f6ef 55%, #dcf0e6 100%);
      background-size: auto, auto, 24px 24px, auto;
      transition: opacity .4s ease;
    }
    #loader.hide { opacity: 0; pointer-events: none; }
    #ld-logo-w { display: none; }
    #ld-logo { position: absolute; left: clamp(40px, 5vw, 96px); top: 30px; height: 54px; width: auto; }
    #ld-hero { max-width: min(640px, 44vw); }
    #ld-hero .ld-eyebrow { margin: 0 0 10px; font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #059669; }
    #ld-hero h2 { margin: 0; font-size: clamp(30px, 3.1vw, 46px); line-height: 1.14; font-weight: 800; color: #064e3b; letter-spacing: -.01em; }
    #ld-hero h2 em { font-style: normal; color: #059669; }
    #ld-hero .ld-sub { margin: 14px 0 0; max-width: 520px; font-size: 15px; line-height: 1.6; color: #3b5b4f; }
    #ld-hero .ld-art { margin-top: 22px; width: 100%; max-width: min(540px, 100%); }
    #ld-hero .ld-art svg { display: block; width: 100%; height: auto; max-height: 38vh; }
    .ld-flow { stroke-dasharray: 6 8; animation: ldflow 2.6s linear infinite; }
    .ld-f1 { animation: ldfloat 6s ease-in-out infinite; }
    .ld-f2 { animation: ldfloat 7s ease-in-out -2s infinite; }
    @keyframes ldflow { to { stroke-dashoffset: -28; } }
    @keyframes ldfloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    /* bar loading: 1 batang, di bawah tengah */
    #loader .ld-foot { position: absolute; left: 0; right: 0; bottom: clamp(28px, 6vh, 56px); display: flex; flex-direction: column; align-items: center; gap: 10px; }
    #loader .ld-bar { width: min(300px, 46vw); height: 6px; border-radius: 99px; overflow: hidden; background: #a7f3d0; }
    #loader .ld-bar::after { content: ""; display: block; height: 100%; width: 38%; border-radius: 99px; background: #059669; animation: ldslide 1.2s ease-in-out infinite; }
    @keyframes ldslide { 0% { transform: translateX(-100%); } 100% { transform: translateX(270%); } }
    #loader .ld-foot span { font-size: 12px; font-weight: 600; color: #3b5b4f; opacity: .8; }
    /* Layar sempit (HP / tablet kecil): hijau seperti desain mobile aplikasi, teks di tengah */
    @media (max-width: 999px) {
      #loader { align-items: center; text-align: center; padding: 0 28px; background: #047857; background-image: radial-gradient(700px 480px at 50% 0%, rgba(16,185,129,.35), transparent 70%); }
      #ld-logo { display: none; }
      #ld-logo-w { display: block; position: absolute; left: 50%; top: 26px; transform: translateX(-50%); height: 40px; width: auto; }
      #ld-hero { max-width: 460px; }
      #ld-hero .ld-eyebrow { color: #6ee7b7; font-size: 11px; }
      #ld-hero h2 { color: #fff; font-size: 26px; }
      #ld-hero h2 em { color: #a7f3d0; }
      #ld-hero .ld-sub { color: #d1fae5; font-size: 14px; margin-left: auto; margin-right: auto; }
      #ld-hero .ld-art { margin-left: auto; margin-right: auto; max-width: 340px; }
      #ld-hero .ld-art svg { max-height: 24vh; }
      #loader .ld-bar { background: rgba(255,255,255,.25); }
      #loader .ld-bar::after { background: #facc15; }
      #loader .ld-foot span { color: #d1fae5; }
    }
    @media (max-height: 600px) { #ld-hero .ld-art { display: none; } }
    @media (prefers-reduced-motion: reduce) { .ld-flow, .ld-f1, .ld-f2, #loader .ld-bar::after { animation: none !important; } }

    /* MOCK */
    #ld-mock { position: absolute; right: clamp(28px, 4vw, 84px); top: 50%; transform: translateY(-52%); width: min(50vw, 840px); }
    #ld-mock .ld-desk svg { display: block; width: 100%; height: auto; filter: drop-shadow(0 22px 36px rgba(6,78,59,.18)); }
    #ld-mock .ld-phone { position: absolute; right: -2.5%; bottom: -9%; width: 21%; animation: ldfloat 6.5s ease-in-out -1s infinite; }
    #ld-mock .ld-phone svg { display: block; width: 100%; height: auto; filter: drop-shadow(0 18px 28px rgba(6,78,59,.28)); }
    #ld-mock .ld-desk { animation: ldfloat 8s ease-in-out infinite; }
    @media (max-width: 1279px) { #ld-hero .ld-art { display: none; } #ld-hero { max-width: min(520px, 42vw); } }
    @media (max-width: 999px) {
      #ld-hero .ld-art { display: none; }
      #ld-mock { position: static; transform: none; width: auto; margin-top: 20px; display: flex; justify-content: center; }
      #ld-mock .ld-desk { display: none; }
      #ld-mock .ld-phone { position: static; width: auto; animation: none; }
      #ld-mock .ld-phone svg { height: 34vh; max-height: 300px; width: auto; }
    }
    @media (max-height: 600px) { #ld-mock .ld-phone svg { height: 26vh; } }
    #loader.ld-plain #ld-hero, #loader.ld-plain #ld-mock { display: none; }   /* tanpa halaman tujuan (login/refresh): hanya latar + logo + bar */
    /* LOGO TENGAH (hanya mode login/tanpa halaman tujuan): napas pelan + cahaya berdenyut + kilau menyapu logo */
    #ld-center { display: none; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -58%); }
    #loader.ld-plain #ld-center { display: block; }
    #loader.ld-plain #ld-logo, #loader.ld-plain #ld-logo-w { display: none !important; }
    #ld-center img { display: block; position: relative; height: clamp(76px, 12vh, 112px); width: auto; animation: ldbreath 2.4s ease-in-out infinite; }
    #ld-center #ld-clogo-w { display: none; }
    #ld-center::before { content: ""; position: absolute; left: 50%; top: 50%; width: 190%; height: 280%; transform: translate(-50%, -50%); background: radial-gradient(closest-side, rgba(16,185,129,.30), transparent 70%); animation: ldglow 2.4s ease-in-out infinite; pointer-events: none; }
    #ld-center::after { content: ""; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(110deg, transparent 38%, rgba(255,255,255,.95) 50%, transparent 62%) 150% 0 / 250% 100% no-repeat;
      -webkit-mask: url(/icons/logo-login.png) center / contain no-repeat; mask: url(/icons/logo-login.png) center / contain no-repeat;
      animation: ldshine 2.4s ease-in-out infinite; }
    @keyframes ldbreath { 0%, 100% { transform: scale(1); opacity: .88; } 50% { transform: scale(1.05); opacity: 1; } }
    @keyframes ldglow { 0%, 100% { opacity: .45; transform: translate(-50%, -50%) scale(.9); } 50% { opacity: .95; transform: translate(-50%, -50%) scale(1.1); } }
    @keyframes ldshine { 0% { background-position: 150% 0; } 55%, 100% { background-position: -50% 0; } }
    @media (max-width: 999px) {
      #ld-center #ld-clogo { display: none; }
      #ld-center #ld-clogo-w { display: block; }
      #ld-center img { height: clamp(58px, 9vh, 78px); }
      #ld-center::before { background: radial-gradient(closest-side, rgba(250,204,21,.22), transparent 70%); }
      #ld-center::after { background: linear-gradient(110deg, transparent 38%, rgba(250,204,21,.95) 50%, transparent 62%) 150% 0 / 250% 100% no-repeat;
        -webkit-mask: url(/icons/logo-white.png) center / contain no-repeat; mask: url(/icons/logo-white.png) center / contain no-repeat; }
    }
    @media (prefers-reduced-motion: reduce) { #ld-center img, #ld-center::before, #ld-center::after { animation: none !important; } }
    /* /MOCK */
  </style>
</head>
<body>
  <div id="loader" aria-busy="true">
    <img id="ld-logo" src="/icons/logo-login.png" alt="RSI" onerror="this.style.display='none'">
    <img id="ld-logo-w" src="/icons/logo-white.png" alt="RSI" onerror="this.style.display='none'">
    <div id="ld-center" aria-hidden="true"><img id="ld-clogo" src="/icons/logo-login.png" alt=""><img id="ld-clogo-w" src="/icons/logo-white.png" alt=""></div>
    <section id="ld-hero" role="status" aria-live="polite">
      <p class="ld-eyebrow" id="ld-eyebrow"></p>
      <h2 id="ld-title"></h2>
      <p class="ld-sub" id="ld-sub"></p>
      <div class="ld-art" id="ld-art" aria-hidden="true"></div>
    </section>
    <div id="ld-mock" aria-hidden="true"><div class="ld-desk" id="ld-desk"></div><div class="ld-phone" id="ld-phone"></div></div>
    <div class="ld-foot" aria-hidden="true">
      <div class="ld-bar"></div>
      <span>Memuat aplikasi...</span>
    </div>
  </div>

      f.src = APP_URL + (p ? '?page=' + encodeURIComponent(p) : '');

            }
